name: Frontend build

on:
  push:
    branches:
      - main
      - feature/personalized-exam-planner
      - feature/daily-plan-generation
      - feature/verified-syllabus-catalog
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build Next.js application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8011
        run: npm run build
