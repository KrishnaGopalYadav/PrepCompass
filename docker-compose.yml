services:
  api:
    build:
      context: ./backend
    container_name: prepcompass-api
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_PATH: /app/data/prepcompass.db
      FRONTEND_URL: http://localhost:3011
      BACKEND_URL: http://localhost:8011
    ports:
      - "8011:8000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8011
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8011
    ports:
      - "3011:3000"
    depends_on:
      - api
    restart: unless-stopped
